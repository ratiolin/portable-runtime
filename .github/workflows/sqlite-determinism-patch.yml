name: SQLite determinism patch

on:
  push:
    branches: [fix/sqlite-exact-replay-determinism]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/sqlite-exact-replay-determinism
          fetch-depth: 0
      - name: Preserve Python semantic values
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/portable_runtime/governance/persistence.py")
          text = path.read_text()
          old = 'value.model_dump(mode="json", exclude={"created_at", "committed_at"})'
          new = 'value.model_dump(mode="python", exclude={"created_at", "committed_at"})'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("semantic dump anchor missing")
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/portable_runtime/governance/persistence.py
          git commit -m 'fix: compare governance replay using Python semantics'
          git push origin HEAD:fix/sqlite-exact-replay-determinism
