name: E1 exact seam patch

on:
  push:
    branches:
      - feat/governance-use-admission

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/governance-use-admission
          persist-credentials: true
      - name: Apply E1 seam
        shell: python
        run: |
          from pathlib import Path

          boundary = Path("src/portable_runtime/core/boundary.py")
          s = boundary.read_text()
          replacements = [
              (
                  "from portable_runtime.core.router import ConstraintRouter\n",
                  "from portable_runtime.core.router import ConstraintRouter\n"
                  "from portable_runtime.governance.use_admission import (\n"
                  "    GovernanceUseAdmission,\n"
                  "    GovernanceUseRequirementResolver,\n"
                  ")\n",
              ),
              (
                  'CODE_QUALIFICATION_CHANGED = "QualificationChanged"\n',
                  'CODE_QUALIFICATION_CHANGED = "QualificationChanged"\n'
                  'CODE_GOVERNANCE_BLOCKED = "GovernanceBlocked"\n'
                  'CODE_GOVERNANCE_UNAVAILABLE = "GovernanceUnavailable"\n'
                  'CODE_GOVERNANCE_STALE = "GovernanceStale"\n',
              ),
              (
                  "    CODE_QUALIFICATION_CHANGED,\n}",
                  "    CODE_QUALIFICATION_CHANGED,\n"
                  "    CODE_GOVERNANCE_BLOCKED,\n"
                  "    CODE_GOVERNANCE_UNAVAILABLE,\n"
                  "    CODE_GOVERNANCE_STALE,\n}",
              ),
              (
                  'def __init__(self, store: Any | None = None, registry: Any | None = None, *, routing: Any | None = None, policy_engine: Any | None = None, reliability: ReliabilityControls | None = None, runtime_id: str = "runtime", contract_registry: CapabilityContractRegistry | None = None, effect_registry: CapabilityEffectRegistry | None = None) -> None:',
                  'def __init__(self, store: Any | None = None, registry: Any | None = None, *, routing: Any | None = None, policy_engine: Any | None = None, reliability: ReliabilityControls | None = None, runtime_id: str = "runtime", contract_registry: CapabilityContractRegistry | None = None, effect_registry: CapabilityEffectRegistry | None = None, governance_requirement_resolver: GovernanceUseRequirementResolver | None = None) -> None:',
              ),
              (
                  '        self.effect_registry = effect_registry or getattr(self.contract_registry, "effect_registry", CapabilityEffectRegistry())\n        self.stage_plan = BoundaryStagePlan()\n',
                  '        self.effect_registry = effect_registry or getattr(self.contract_registry, "effect_registry", CapabilityEffectRegistry())\n'
                  '        self.governance_requirement_resolver = governance_requirement_resolver\n'
                  '        self.stage_plan = BoundaryStagePlan()\n',
              ),
              (
                  '            except Exception as exc:  # noqa: BLE001\n'
                  '                _append_event(store, CODE_QUALIFICATION_UNAVAILABLE, request.id, {"reason": str(exc)})\n'
                  '                return self._error_result(request, CODE_QUALIFICATION_UNAVAILABLE, f"qualification resolution failed: {exc}")\n\n'
                  '        # Policy failures and exceptions are always STOP.  ``require`` is not\n',
                  '            except Exception as exc:  # noqa: BLE001\n'
                  '                _append_event(store, CODE_QUALIFICATION_UNAVAILABLE, request.id, {"reason": str(exc)})\n'
                  '                return self._error_result(request, CODE_QUALIFICATION_UNAVAILABLE, f"qualification resolution failed: {exc}")\n\n'
                  '        # Governance-use is a read-only admission seam. The runtime-owned\n'
                  '        # requirement resolver is independent from the governance projection;\n'
                  '        # canonical Event history is reconstructed in memory so an empty or\n'
                  '        # stale sidecar can never be interpreted as "no blocker".\n'
                  '        governance = GovernanceUseAdmission(store).evaluate(\n'
                  '            request,\n'
                  '            self.governance_requirement_resolver,\n'
                  '        )\n'
                  '        if governance.status in {"blocked", "unavailable", "stale"}:\n'
                  '            code = {\n'
                  '                "blocked": CODE_GOVERNANCE_BLOCKED,\n'
                  '                "unavailable": CODE_GOVERNANCE_UNAVAILABLE,\n'
                  '                "stale": CODE_GOVERNANCE_STALE,\n'
                  '            }[governance.status]\n'
                  '            details: dict[str, Any] = {\n'
                  '                "reason": governance.reason,\n'
                  '                "scheme_id": governance.scheme_id,\n'
                  '                "use_context": (\n'
                  '                    governance.use_context.name\n'
                  '                    if governance.use_context is not None\n'
                  '                    else None\n'
                  '                ),\n'
                  '            }\n'
                  '            if governance.snapshot_digest is not None:\n'
                  '                details["snapshot_digest"] = governance.snapshot_digest\n'
                  '            _append_event(store, code, request.id, details)\n'
                  '            _append_event(\n'
                  '                store,\n'
                  '                "InvocationBlocked",\n'
                  '                request.id,\n'
                  '                {"code": code, **details},\n'
                  '            )\n'
                  '            return self._error_result(\n'
                  '                request,\n'
                  '                code,\n'
                  '                governance.reason,\n'
                  '                scheme_id=governance.scheme_id,\n'
                  '                governance_snapshot_digest=governance.snapshot_digest,\n'
                  '            )\n\n'
                  '        # Policy failures and exceptions are always STOP.  ``require`` is not\n',
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"boundary seam anchor missing: {old[:80]!r}")
              s = s.replace(old, new, 1)
          boundary.write_text(s)

          stages = Path("src/portable_runtime/core/boundary_stages.py")
          s = stages.read_text()
          old = '        "qualification",\n        "policy",\n'
          new = '        "qualification",\n        "governance-use",\n        "policy",\n'
          if old not in s:
              raise SystemExit("boundary stage anchor missing")
          stages.write_text(s.replace(old, new, 1))

          arch = Path("tests/conformance/test_boundary_architecture.py")
          s = arch.read_text()
          old = 'assert plan.names[:4] == ("qualification", "policy", "authorization", "procedure")'
          new = 'assert plan.names[:5] == ("qualification", "governance-use", "policy", "authorization", "procedure")'
          if old not in s:
              raise SystemExit("architecture stage assertion anchor missing")
          arch.write_text(s.replace(old, new, 1))

          ci = Path(".github/workflows/ci.yml")
          s = ci.read_text()
          anchor = "          tests/conformance/test_distinction_governance_bundle_portability.py\n"
          if anchor not in s:
              raise SystemExit("strict-conformance anchor missing")
          ci.write_text(s.replace(anchor, anchor + "          tests/conformance/test_governance_use_admission.py\n", 1))

          Path(".github/workflows/e1-source-artifact.yml").unlink()
      - name: Commit exact seam
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: insert read-only governance-use boundary seam"
          git push origin HEAD:feat/governance-use-admission
