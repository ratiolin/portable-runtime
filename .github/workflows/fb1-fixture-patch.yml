name: F1-B1 fixture patch

on:
  push:
    branches: [feat/execution-outcome-separation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/execution-outcome-separation
          fetch-depth: 0
      - name: Move result commit failure to execution projection
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/conformance/test_authoritative.py")
          text = path.read_text()
          old = '''class FailingResultCommitStore(InMemoryStateStore):\n    def save_outcome(self, value: Any) -> None:\n        raise RuntimeError("result journal unavailable")\n'''
          new = '''class FailingResultCommitStore(InMemoryStateStore):\n    def save_action(self, value: Any) -> None:\n        if getattr(value, "status", "") != "running":\n            raise RuntimeError("execution projection unavailable")\n        super().save_action(value)\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("result commit fixture anchor missing")
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/conformance/test_authoritative.py
          git commit -m 'test: inject result commit failure at execution projection'
          git push origin HEAD:feat/execution-outcome-separation
