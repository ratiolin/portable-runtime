name: F1-B1 event patch

on:
  push:
    branches: [feat/execution-outcome-separation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/execution-outcome-separation
          fetch-depth: 0
      - name: Mark provider and projection events as execution-level
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/portable_runtime/core/boundary.py")
          text = path.read_text()
          old_invocation = '''        _append_event(\n            store,\n            "InvocationCompleted",\n            request.id,\n            {"provider_id": provider_id, "status": result.status, "capability": request.capability},\n        )\n'''
          new_invocation = '''        _append_event(\n            store,\n            "InvocationCompleted",\n            request.id,\n            {\n                "provider_id": provider_id,\n                "status": result.status,\n                "capability": request.capability,\n                "semantic_level": "execution",\n                "authoritative_outcome": False,\n            },\n        )\n'''
          if old_invocation in text:
              text = text.replace(old_invocation, new_invocation, 1)

          old_comment = '''        # Durable projection is part of the authoritative outcome.  A commit\n        # failure after provider success is recoverable/unknown, never success.\n'''
          new_comment = '''        # Durable execution projection is separate from objective Outcome authority.\n        # A projection commit failure after provider execution is recoverable/unknown.\n'''
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)

          old_projection = '''        if projection.projected_status is not None:\n            _append_event(\n                store,\n                "CapabilitySucceeded" if projection.projected_status == "succeeded" else "CapabilityCompleted",\n                request.id,\n                {"provider_id": provider_id, "status": projection.projected_status, "capability": request.capability},\n            )\n            _append_event(\n                store,\n                "OutcomeRecorded",\n                request.id,\n                {"outcome_id": projection.outcome_id, "status": projection.projected_status, "provider_id": provider_id},\n            )\n'''
          new_projection = '''        if projection.projected_status is not None:\n            execution_payload = {\n                "provider_id": provider_id,\n                "status": projection.projected_status,\n                "capability": request.capability,\n                "semantic_level": "execution",\n                "authoritative_outcome": False,\n            }\n            _append_event(\n                store,\n                "ExecutionSucceeded"\n                if projection.projected_status == "succeeded"\n                else "ExecutionCompleted",\n                request.id,\n                execution_payload,\n            )\n            # Compatibility only: capability success is an execution fact, not an Outcome.\n            _append_event(\n                store,\n                "CapabilitySucceeded"\n                if projection.projected_status == "succeeded"\n                else "CapabilityCompleted",\n                request.id,\n                {**execution_payload, "compatibility_event": True},\n            )\n'''
          if old_projection in text:
              text = text.replace(old_projection, new_projection, 1)
          elif '"ExecutionSucceeded"' not in text:
              raise SystemExit("execution event projection anchor missing")
          path.write_text(text)
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/portable_runtime/core/boundary.py
          git commit -m 'feat: mark provider completion as execution-level'
          git push origin HEAD:feat/execution-outcome-separation
