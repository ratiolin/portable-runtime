name: E2a exact permit binding patch

on:
  push:
    branches:
      - feat/governance-permit-binding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/governance-permit-binding
          persist-credentials: true
      - name: Apply E2a permit binding
        shell: python
        run: |
          from pathlib import Path

          # InvocationPermit: bind explicit governance applicability + two digests.
          q = Path("src/portable_runtime/core/qualification.py")
          s = q.read_text()
          anchor = "\n\n@dataclass(frozen=True)\nclass InvocationPermit:\n"
          insert = '''\n\nGOVERNANCE_NOT_APPLICABLE_DIGEST = hashlib.sha256(\n    json.dumps(\n        {"schema": "governance-use-requirement-v1", "applicable": False},\n        sort_keys=True,\n        separators=(",", ":"),\n    ).encode()\n).hexdigest()\n\n\n@dataclass(frozen=True)\nclass InvocationPermit:\n'''
          if anchor not in s:
              raise SystemExit("qualification permit class anchor missing")
          s = s.replace(anchor, insert, 1)
          old = '''    request_snapshot: str\n    issued_at: datetime = field(default_factory=lambda: datetime.now(UTC))\n'''
          new = '''    request_snapshot: str\n    governance_applicable: bool = False\n    governance_requirement_digest: str = GOVERNANCE_NOT_APPLICABLE_DIGEST\n    governance_snapshot_digest: str = GOVERNANCE_NOT_APPLICABLE_DIGEST\n    issued_at: datetime = field(default_factory=lambda: datetime.now(UTC))\n'''
          if old not in s:
              raise SystemExit("qualification permit fields anchor missing")
          s = s.replace(old, new, 1)
          old = '''        qualification_digest: str,\n        lease_generation: int,\n    ) -> InvocationPermit:\n'''
          new = '''        qualification_digest: str,\n        lease_generation: int,\n        governance_applicable: bool = False,\n        governance_requirement_digest: str | None = None,\n        governance_snapshot_digest: str | None = None,\n    ) -> InvocationPermit:\n'''
          if old not in s:
              raise SystemExit("qualification permit issue signature anchor missing")
          s = s.replace(old, new, 1)
          old = '''        authority_payload = {\n            "request_id": request_payload.get("id"),\n'''
          new = '''        if governance_applicable:\n            if not governance_requirement_digest or not governance_snapshot_digest:\n                raise QualificationResolutionError(\n                    "governed invocation permit requires governance requirement and snapshot digests"\n                )\n            effective_governance_requirement_digest = governance_requirement_digest\n            effective_governance_snapshot_digest = governance_snapshot_digest\n        else:\n            effective_governance_requirement_digest = (\n                governance_requirement_digest or GOVERNANCE_NOT_APPLICABLE_DIGEST\n            )\n            effective_governance_snapshot_digest = (\n                governance_snapshot_digest or GOVERNANCE_NOT_APPLICABLE_DIGEST\n            )\n\n        authority_payload = {\n            "request_id": request_payload.get("id"),\n'''
          if old not in s:
              raise SystemExit("qualification authority payload anchor missing")
          s = s.replace(old, new, 1)
          old = '''            "qualification_digest": qualification_digest,\n        }\n'''
          new = '''            "qualification_digest": qualification_digest,\n            "governance": {\n                "applicable": governance_applicable,\n                "requirement_digest": effective_governance_requirement_digest,\n                "snapshot_digest": effective_governance_snapshot_digest,\n            },\n        }\n'''
          if old not in s:
              raise SystemExit("qualification authority governance anchor missing")
          s = s.replace(old, new, 1)
          old = '''            lease_generation=lease_generation,\n            request_snapshot=snapshot,\n        )\n'''
          new = '''            lease_generation=lease_generation,\n            request_snapshot=snapshot,\n            governance_applicable=governance_applicable,\n            governance_requirement_digest=effective_governance_requirement_digest,\n            governance_snapshot_digest=effective_governance_snapshot_digest,\n        )\n'''
          if old not in s:
              raise SystemExit("qualification permit return anchor missing")
          q.write_text(s)

          # Persistence-only correction for a precommit that is rejected before reality exit.
          stages = Path("src/portable_runtime/core/boundary_stages.py")
          s = stages.read_text()
          anchor = '''\n\n@dataclass(frozen=True)\nclass ProjectionDecision:\n'''
          insert = '''\n\n@dataclass(frozen=True)\nclass PreinvokeAbortDecision:\n    aborted: bool = False\n    error: Exception | None = None\n\n\ndef abort_preinvocation_records(\n    store: Any,\n    request: CapabilityRequest,\n    *,\n    provider_id: str,\n    records: ExecutionRecordIds,\n    code: str,\n    reason: str,\n) -> PreinvokeAbortDecision:\n    """Terminalize precommitted execution records without creating an Outcome."""\n\n    if store is None or records.step_id is None:\n        return PreinvokeAbortDecision()\n    error_payload = {"code": code, "reason": reason, "phase": "before-reality-exit"}\n    try:\n        step = store.get_step(records.step_id) if hasattr(store, "get_step") else None\n        attempt = (\n            store.get_attempt(records.attempt_id)\n            if records.attempt_id and hasattr(store, "get_attempt")\n            else None\n        )\n        if step is None or (records.attempt_id is not None and attempt is None):\n            raise RuntimeError("pre-invocation abort is missing precommitted execution records")\n        step_update = step.model_copy(update={"status": "cancelled", "updated_at": utcnow()})\n        attempt_update = (\n            attempt.model_copy(\n                update={\n                    "status": "cancelled",\n                    "ended_at": utcnow(),\n                    "error": error_payload,\n                }\n            )\n            if attempt is not None\n            else None\n        )\n        action_update = (\n            Action(\n                id=records.action_id,\n                work_id=request.work_id or "",\n                run_id=request.run_id or "",\n                capability=request.capability,\n                provider_id=provider_id,\n                request_ref=request.id,\n                status="cancelled",\n                metadata={"preinvocation_abort": error_payload},\n            )\n            if records.action_id is not None\n            else None\n        )\n\n        def commit() -> None:\n            store.save_step(step_update)\n            if attempt_update is not None:\n                store.save_attempt(attempt_update)\n            if action_update is not None:\n                store.save_action(action_update)\n\n        if hasattr(store, "transaction"):\n            with store.transaction():\n                commit()\n        else:\n            commit()\n        return PreinvokeAbortDecision(aborted=True)\n    except Exception as exc:\n        return PreinvokeAbortDecision(error=exc)\n\n\n@dataclass(frozen=True)\nclass ProjectionDecision:\n'''
          if anchor not in s:
              raise SystemExit("boundary stages projection anchor missing")
          s = s.replace(anchor, insert, 1)
          stages.write_text(s)

          # RealityBoundary: post-routing recheck, permit binding, final recheck + abort.
          boundary = Path("src/portable_runtime/core/boundary.py")
          s = boundary.read_text()
          old = '''    ReliabilityStageInput,\n    commit_execution_projection,\n'''
          new = '''    ReliabilityStageInput,\n    abort_preinvocation_records,\n    commit_execution_projection,\n'''
          if old not in s:
              raise SystemExit("boundary stage import anchor missing")
          s = s.replace(old, new, 1)
          old = '''CODE_GOVERNANCE_STALE = "GovernanceStale"\nBOUNDARY_ERROR_CODES = {\n'''
          new = '''CODE_GOVERNANCE_STALE = "GovernanceStale"\nCODE_GOVERNANCE_CHANGED = "GovernanceChanged"\nBOUNDARY_ERROR_CODES = {\n'''
          if old not in s:
              raise SystemExit("boundary governance code anchor missing")
          s = s.replace(old, new, 1)
          old = '''    CODE_GOVERNANCE_STALE,\n}\n'''
          new = '''    CODE_GOVERNANCE_STALE,\n    CODE_GOVERNANCE_CHANGED,\n}\n'''
          if old not in s:
              raise SystemExit("boundary error set anchor missing")
          s = s.replace(old, new, 1)
          anchor = '''    return parsed if parsed >= 1 else None\n\nclass RealityBoundary:\n'''
          insert = '''    return parsed if parsed >= 1 else None\n\n\ndef _governance_recheck_failure(reference: Any, current: Any) -> tuple[str, str] | None:\n    if current.status == "unavailable":\n        return CODE_GOVERNANCE_UNAVAILABLE, current.reason\n    if current.status == "stale":\n        return CODE_GOVERNANCE_STALE, current.reason\n    if current.status not in {"allowed", "not-applicable"}:\n        return (\n            CODE_GOVERNANCE_CHANGED,\n            f"governance use judgment changed after admission: {current.reason}",\n        )\n    if (\n        current.status != reference.status\n        or current.requirement_digest != reference.requirement_digest\n        or current.snapshot_digest != reference.snapshot_digest\n    ):\n        return (\n            CODE_GOVERNANCE_CHANGED,\n            "governance use judgment no longer matches the admitted snapshot",\n        )\n    return None\n\n\ndef _governance_permit_failure(permit: InvocationPermit, current: Any) -> tuple[str, str] | None:\n    if current.status == "unavailable":\n        return CODE_GOVERNANCE_UNAVAILABLE, current.reason\n    if current.status == "stale":\n        return CODE_GOVERNANCE_STALE, current.reason\n    if current.status not in {"allowed", "not-applicable"}:\n        return (\n            CODE_GOVERNANCE_CHANGED,\n            f"governance use judgment changed before reality exit: {current.reason}",\n        )\n    applicable = current.status == "allowed"\n    if (\n        permit.governance_applicable != applicable\n        or not permit.governance_requirement_digest\n        or not permit.governance_snapshot_digest\n        or permit.governance_requirement_digest != current.requirement_digest\n        or permit.governance_snapshot_digest != current.snapshot_digest\n    ):\n        return (\n            CODE_GOVERNANCE_CHANGED,\n            "invocation permit governance binding does not match current admission",\n        )\n    return None\n\n\nclass RealityBoundary:\n'''
          if anchor not in s:
              raise SystemExit("boundary helper anchor missing")
          s = s.replace(anchor, insert, 1)

          old = '''        permit = InvocationPermit.issue(\n            request,\n            provider_id=provider_id,\n            qualification_digest=assessment.digest if assessment is not None else "",\n            lease_generation=_extract_lease_generation(request) or 0,\n        )\n'''
          new = '''        refreshed_governance = GovernanceUseAdmission(store).evaluate(\n            request,\n            self.governance_requirement_resolver,\n        )\n        governance_failure = _governance_recheck_failure(governance, refreshed_governance)\n        if governance_failure is not None:\n            code, reason = governance_failure\n            _append_event(\n                store,\n                code,\n                request.id,\n                {"reason": reason, "provider_id": provider_id, "phase": "post-routing"},\n            )\n            _append_event(\n                store,\n                "InvocationBlocked",\n                request.id,\n                {"code": code, "reason": reason, "phase": "post-routing"},\n            )\n            return self._error_result(\n                request,\n                code,\n                reason,\n                provider_id=provider_id,\n                governance_snapshot_digest=refreshed_governance.snapshot_digest,\n            )\n        governance = refreshed_governance\n        permit = InvocationPermit.issue(\n            request,\n            provider_id=provider_id,\n            qualification_digest=assessment.digest if assessment is not None else "",\n            lease_generation=_extract_lease_generation(request) or 0,\n            governance_applicable=governance.status == "allowed",\n            governance_requirement_digest=governance.requirement_digest,\n            governance_snapshot_digest=governance.snapshot_digest,\n        )\n'''
          if old not in s:
              raise SystemExit("boundary permit issuance anchor missing")
          s = s.replace(old, new, 1)

          old = '''        context = InvocationContext(runtime_id=self.runtime_id, work_id=execution_request.work_id, run_id=execution_request.run_id, lease_generation=permit.lease_generation, idempotency_key=execution_request.idempotency_key)\n'''
          new = '''        def abort_before_reality_exit(code: str, reason: str) -> CapabilityResult:\n            nonlocal reliability_started\n            if reliability_started and hasattr(self.reliability, "complete_action"):\n                try:\n                    _call_supported(self.reliability.complete_action, side_effect=True)\n                except Exception:\n                    pass\n                reliability_started = False\n            abort = abort_preinvocation_records(\n                store,\n                request,\n                provider_id=provider_id,\n                records=records,\n                code=code,\n                reason=reason,\n            )\n            if abort.error is not None:\n                abort_reason = (\n                    f"pre-invocation abort projection failed after {code}: {abort.error}"\n                )\n                _append_event(\n                    store,\n                    CODE_PRECOMMIT_FAILED,\n                    request.id,\n                    {"reason": abort_reason, "provider_id": provider_id},\n                )\n                return self._error_result(\n                    request,\n                    CODE_PRECOMMIT_FAILED,\n                    abort_reason,\n                    provider_id=provider_id,\n                )\n            details = {\n                "code": code,\n                "reason": reason,\n                "provider_id": provider_id,\n                "phase": "before-reality-exit",\n            }\n            _append_event(store, code, request.id, details)\n            _append_event(store, "InvocationAbortedBeforeRealityExit", request.id, details)\n            _append_event(store, "InvocationBlocked", request.id, details)\n            return self._error_result(\n                request,\n                code,\n                reason,\n                provider_id=provider_id,\n                governance_snapshot_digest=permit.governance_snapshot_digest,\n            )\n\n        if assessment is not None and store is not None:\n            try:\n                if not assessment.refresh_matches(store, request):\n                    return abort_before_reality_exit(\n                        CODE_QUALIFICATION_CHANGED,\n                        "authoritative qualification facts changed before reality exit",\n                    )\n            except QualificationResolutionError as exc:\n                return abort_before_reality_exit(CODE_QUALIFICATION_CHANGED, str(exc))\n            except Exception as exc:  # noqa: BLE001\n                return abort_before_reality_exit(\n                    CODE_QUALIFICATION_CHANGED,\n                    f"qualification final revalidation failed: {exc}",\n                )\n\n        final_governance = GovernanceUseAdmission(store).evaluate(\n            request,\n            self.governance_requirement_resolver,\n        )\n        governance_failure = _governance_permit_failure(permit, final_governance)\n        if governance_failure is not None:\n            code, reason = governance_failure\n            return abort_before_reality_exit(code, reason)\n\n        context = InvocationContext(runtime_id=self.runtime_id, work_id=execution_request.work_id, run_id=execution_request.run_id, lease_generation=permit.lease_generation, idempotency_key=execution_request.idempotency_key)\n'''
          if old not in s:
              raise SystemExit("boundary final recheck anchor missing")
          s = s.replace(old, new, 1)

          old = '''                "qualification_digest": permit.qualification_digest,\n                "invocation_permit_provider": permit.provider_id,\n                "invocation_permit_request": permit.request_digest,\n'''
          new = '''                "qualification_digest": permit.qualification_digest,\n                "governance_applicable": permit.governance_applicable,\n                "governance_requirement_digest": permit.governance_requirement_digest,\n                "governance_snapshot_digest": permit.governance_snapshot_digest,\n                "invocation_permit_provider": permit.provider_id,\n                "invocation_permit_request": permit.request_digest,\n'''
          if old not in s:
              raise SystemExit("boundary context metadata anchor missing")
          s = s.replace(old, new, 1)
          boundary.write_text(s)
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/core/qualification.py src/portable_runtime/core/boundary_stages.py src/portable_runtime/core/boundary.py
          git commit -m "feat: bind governance judgment to invocation permit"
          git push origin HEAD:feat/governance-permit-binding
