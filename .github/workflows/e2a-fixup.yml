name: E2a permit field fixup

on:
  push:
    branches:
      - feat/governance-permit-binding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/governance-permit-binding
          persist-credentials: true
      - name: Patch permit return
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/portable_runtime/core/qualification.py")
          s = path.read_text()
          old = '''        return cls(\n            request_digest=digest,\n            qualification_digest=qualification_digest,\n            provider_id=provider_id,\n            lease_generation=lease_generation,\n            request_snapshot=snapshot,\n        )\n'''
          new = '''        return cls(\n            request_digest=digest,\n            qualification_digest=qualification_digest,\n            provider_id=provider_id,\n            lease_generation=lease_generation,\n            request_snapshot=snapshot,\n            governance_applicable=governance_applicable,\n            governance_requirement_digest=effective_governance_requirement_digest,\n            governance_snapshot_digest=effective_governance_snapshot_digest,\n        )\n'''
          if old not in s:
              raise SystemExit("permit return anchor missing")
          path.write_text(s.replace(old, new, 1))
      - name: Commit fixup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/core/qualification.py
          git commit -m "fix: persist governance binding on invocation permit"
          git push origin HEAD:feat/governance-permit-binding
